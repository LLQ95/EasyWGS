site_name: EasyWGS Guidebook
site_description: "Reproducible WGS workflow for bacterial isolates with cross-domain profiles for viruses, pathogenic fungi and probiotics: short/long/hybrid assembly, decontamination, typing, comparison and time-scaled trees"
site_author: EasyWGS contributors
repo_url: https://github.com/LLQ95/EasyWGS
repo_name: EasyWGS
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          nav_translations:
            Home: Home
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            "Workflow overview (Figure 1)": 流程总览图
            Installation: 安装
            Quick start: 快速开始
            Reproducibility and tests: 可复现性与测试
            "Worked example (public panel)": 实战示例(公共数据面板)
            "Cluster checklist (real panel)": 集群运行清单(真实面板)
            Inputs and samplesheet: 输入与样本表
            Workflows: 分析流程
            Short-read (Illumina): 二代 Illumina 流程
            Long-read and hybrid: 三代与混合组装流程
            Decontamination and gates: 双层去污染与质量门控
            Two parallel strategies: 两条并行策略
            "Reference mapping (module 12)": "参考比对流程（模块 12）"
            Modules: 分析模块
            "MLST, serotyping, cgMLST": "MLST、血清型与 cgMLST"
            "Specialized pathogens (toxins & surface loci)": "专化病原（毒素与表面位点）"
            Annotation, AMR and MGE: 注释、耐药、毒力与可移动元件
            Pangenome: 泛基因组
            Phylogeny and time tree: 系统发育与时间树
            "GWAS and post-GWAS": "GWAS 与 post-GWAS"
            Visualization: 可视化
            "Beyond bacteria: viruses, fungi, probiotics": "超越细菌：病毒、真菌与益生菌"
            Tool map: 工具地图(二代/三代对照)
            "Tool encyclopedia (alternatives & legacy)": 工具百科(备选与旧代工具)
            Software versions: 软件版本与时效性
            FAQ: 常见问题
            Contributing: 贡献指南
            Changelog: 更新日志

nav:
  - Home: index.md
  - "Workflow overview (Figure 1)": workflow-figure.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - Reproducibility and tests: reproducibility.md
  - "Worked example (public panel)": example-walkthrough.md
  - Cluster checklist (real panel): cluster-checklist.md
  - Inputs and samplesheet: samplesheet.md
  - Workflows:
      - Two parallel strategies: pipelines-strategies.md
      - Short-read (Illumina): workflow-shortread.md
      - Long-read and hybrid: workflow-longread.md
      - Decontamination and gates: decontamination.md
      - Reference mapping (module 12): mapping-pipeline.md
  - Modules:
      - MLST, serotyping, cgMLST: typing.md
      - "Specialized pathogens (toxins & surface loci)": specialized-pathogens.md
      - Annotation, AMR and MGE: annotation-amr-mge.md
      - Pangenome: pangenome.md
      - Phylogeny and time tree: phylogeny-timetree.md
      - GWAS and post-GWAS: gwas-postgwas.md
      - Visualization: visualization.md
  - "Beyond bacteria: viruses, fungi, probiotics": extensibility.md
  - Tool map: toolmap.md
  - "Tool encyclopedia (alternatives & legacy)": alternative-tools.md
  - Software versions: versions.md
  - FAQ: faq.md
  - Contributing: contributing.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
