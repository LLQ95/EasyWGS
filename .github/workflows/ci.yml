name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static:
    name: Static checks and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-doc.txt
      - name: Repository static checks
        run: python tests/run_static_checks.py
      - name: Build guidebook with MkDocs (strict)
        run: mkdocs build --clean --strict

  smoke:
    name: Functional smoke test (synthetic data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install minimal bioinformatics environment
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: install/environment.ci.yml
          environment-name: easywgs-ci
          cache-downloads: true
          cache-env: true
      - name: Run end-to-end smoke test
        shell: bash -l {0}
        run: bash tests/run_smoke.sh
